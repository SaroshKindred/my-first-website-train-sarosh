<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valiant Video Enterprises - Sign-in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ НАВИГАЦИЯ -->
    <header class="navbar">
        <button class="nav-btn active" id="nav-signin">Sign-in</button>
        <button class="nav-btn" id="nav-store">Adult Store</button>
    </header>

    <!-- ОСНОВНОЙ БЛОК ВХОДА -->
    <main class="main-card">
        <div class="site-header">valiant video enterprises</div>

        <div class="warning-box">
            <span class="warning-badge">WARNING:</span>
            <h2>THIS SITE IS FOR ADULTS ONLY<br>AND CONTAINS DISTURBING MATERIAL.</h2>
        </div>

        <form class="login-box" id="login-form">
            <div class="form-row">
                <div class="input-group">
                    <label for="username">username:</label>
                    <input type="text" id="username" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">password:</label>
                    <input type="password" id="password">
                </div>
                <button type="submit" class="login-btn">Login</button>
            </div>
            <p id="error-msg" class="error-text"></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
