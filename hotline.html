<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valiant Video Enterprises - Hot Line</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0b0b0b;
      color: #33ff33;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Корпус устройства */
    .pager-device {
      background: #1c1d1f;
      border: 4px solid #333;
      border-radius: 12px;
      padding: 20px;
      width: 340px;
      box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,255,255,0.05);
    }

    .brand-header {
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-align: center;
    }

    /* Монохромный LCD экран */
    .screen {
      background-color: #051a05;
      border: 3px solid #113311;
      border-radius: 4px;
      padding: 12px;
      height: 110px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0,255,0,0.2);
    }

    /* Эффект сканирующих линий (CRT) */
    .screen::before {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    .display-text {
      font-size: 14px;
      line-height: 1.4;
      text-shadow: 0 0 5px #33ff33;
      white-space: pre-wrap;
    }

    /* Кнопочный блок */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      background: #2a2c30;
      color: #ddd;
      border: 2px solid #444;
      border-radius: 6px;
      padding: 12px 0;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      user-select: none;
      box-shadow: 0 3px 0 #111;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111;
    }

    .btn-call {
      background: #8b0000;
      color: #fff;
      border-color: #a00;
      grid-column: span 3;
    }
    
    .btn-call:hover {
      background: #a00000;
    }
  </style>
</head>
<body>
<a href="index.html" class="back-btn">← BACK</a>
<div class="pager-device">
  <div class="brand-header">VALIANT VIDEO • PAINPAGER 1997</div>
  
  <div class="screen">
    <div id="display" class="display-text">ENTER NUMBER...</div>
  </div>

  <div class="keypad">
    <button class="btn" onclick="press('1')">1</button>
    <button class="btn" onclick="press('2')">2</button>
    <button class="btn" onclick="press('3')">3</button>
    <button class="btn" onclick="press('4')">4</button>
    <button class="btn" onclick="press('5')">5</button>
    <button class="btn" onclick="press('6')">6</button>
    <button class="btn" onclick="press('7')">7</button>
    <button class="btn" onclick="press('8')">8</button>
    <button class="btn" onclick="press('9')">9</button>
    <button class="btn" onclick="press('*')">*</button>
    <button class="btn" onclick="press('0')">0</button>
    <button class="btn" onclick="clearInput()">C</button>
    <button class="btn btn-call" onclick="makeCall()">[ DIAL / CONNECT ]</button>
  </div>
</div>

<script>
  let currentInput = "";
  let dialState = null; // для многошаговых диалогов
  const display = document.getElementById('display');

  // Звуковой синтезатор
  function playTone(freq = 440, type = 'sine', duration = 0.08) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function press(val) {
    playTone(600, 'square');
    if (currentInput.length < 15) {
      currentInput += val;
      display.innerText = "DIAL: " + currentInput;
    }
  }

  function clearInput() {
    playTone(300, 'sawtooth');
    currentInput = "";
    display.innerText = "ENTER NUMBER...";
  }

  // Главная функция вызова
  function makeCall() {
    playTone(880, 'square', 0.2);
    display.innerText = "CONNECTING...";

    setTimeout(() => {
      const n = currentInput;

      // 1. 911 — перехват линии
      if (n === "911") {
        playTone(150, 'sawtooth', 0.5);
        if (dialState === "cash") {
          typeText("!!! WARNING !!!\nLINE INTERCEPTED\n> THEY'RE TRACING YOU, CASH.\n> BURN THE PHONE.");
        } else {
          typeText("!!! WARNING !!!\nLINE INTERCEPTED\nCOMMUNICATION IS BLOCKED");
        }
      }
      // 2. Горячая линия Starkweather (1900 / 900)
      else if (n.includes("1900") || n.includes("900")) {
        if (dialState === "cash") {
          typeText("> YOUR VOICE IS RESERVED\n> FOR THE FINALE, CASH.\n> STARKWEATHER IS SAVING IT.");
        } else {
          typeText("> VALIANT VIDEO ENTERPRISES\n> LEAVE YOUR ORDER AFTER THE BEEP.\n> PRICE: $2.99/MIN.\n> WE KNOW WHERE YOU LIVE.");
        }
      }
      // 3. CASH (2274) — главный герой
      else if (n === "2274") {
        dialState = "cash";
        typeText("> JAMES EARL CASH.\n> THE PIG WHO WOULDN'T STAY DEAD.\n> WE'RE STILL FILMING, CASH.\n> HUNTING SEASON NEVER ENDS FOR YOU.");
      }
      // 4. HUNTER (486837) — многошаговый диалог
      else if (n === "486837") {
        if (dialState === "hunter") {
          dialState = "hunter2";
          typeText("> STARKWEATHER LIKES WHAT HE SEES.\n> MORE BLOOD. MORE DRAMA.\n> AND BRING THE CAMERA CLOSER.");
        } else {
          dialState = "hunter";
          typeText("> HUNTING SEASON IS OPEN.\n> SKINZ. WARDOGS. INNOCENTZ.\n> THEY ALL WANT A PIECE OF YOU.\n> STAY LOW. STAY ALIVE.");
        }
      }
      // 5. PORTER (767837) — доктор
      else if (n === "767837") {
        dialState = "porter";
        typeText("> DR. PORTER IS NOT IN.\n> HE LEFT THE BUILDING.\n> PERMANENTLY.\n> STOP CALLING THIS NUMBER.");
      }
      // 6. DIE (343)
      else if (n === "343") {
        typeText("> SOON.\n> EVERY PIG DIES EVENTUALLY.\n> TODAY IS A GOOD DAY FOR IT.");
      }
      // 7. BURN (2876) — бензоколонка
      else if (n === "2876") {
        typeText("> THE GAS STATION REMEMBERS YOU.\n> THE SMELL OF IT. THE SCREAMING.\n> WE WERE ROLLING TAPE THE WHOLE TIME.");
      }
      // 8. SAW (729)
      else if (n === "729") {
        typeText("> WE HAVE MANY WAYS TO CUT YOU OPEN.\n> THE CHAINSAW WAS JUST THE WARM-UP.");
      }
      // 9. 666 — Пасхалка
      else if (n === "666") {
        dialState = "stark";
        typeText("> STARKWEATHER IS WATCHING YOU...\n> RUN.");
      }
      // 10. 000 — Секретный код
      else if (n === "000") {
        if (dialState === "stark") {
          dialState = "club";
          typeText("> VALIANT CLUB ACCESS GRANTED.\n> STARKWEATHER SENDS HIS REGARDS.\n> CODE: DISCOUNT-1997\n> USE AT CHECKOUT.");
        } else {
          typeText("> VALIANT CLUB CODE:\n> DISCOUNT-1997\n> USE AT CHECKOUT.");
        }
      }
      // 11. Пустой ввод
      else if (n === "") {
        display.innerText = "ERROR: NO NUMBER";
      }
      // 12. Любой другой неизвестный номер
      else {
        display.innerText = "BUSY SIGNAL...\nTRY AGAIN LATER.";
        playTone(200, 'sawtooth', 0.4);
      }
    }, 1000);
  }

  // Функция посимвольной печати текста с аудио-кликом
  function typeText(text) {
    display.innerText = "";
    let i = 0;
    
    const timer = setInterval(() => {
      display.innerText += text[i];
      playTone(700, 'sine', 0.02);
      i++;
      if (i >= text.length) {
        clearInterval(timer);
      }
    }, 35);
  }
</script>

</body>
</html>
